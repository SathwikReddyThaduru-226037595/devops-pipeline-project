global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'user-management-api'
    static_configs:
      - targets: ['app-production:3000']
    metrics_path: '/metrics'
    scrape_interval: 5s
