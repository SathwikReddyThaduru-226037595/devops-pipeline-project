services:
  app-production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-api-production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - production-network
    restart: always

  prometheus:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - production-network
    restart: always

  grafana:
    build:
      context: ./monitoring
      dockerfile: Dockerfile.grafana
    container_name: grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - production-network
    restart: always

networks:
  production-network:
    driver: bridge
