version: '3.8'

services:
  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-api-staging
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - staging-network
    restart: unless-stopped

networks:
  staging-network:
    driver: bridge
